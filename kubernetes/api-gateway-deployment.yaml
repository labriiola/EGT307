apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
spec:
  # Only 1 copy, the gateway is lightweight, it just routes requests, so it doesn't need scaling the way inference does
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
        - name: api-gateway-service
          # Pulls the image we built and pushed to Docker Hub
          image: yixinn/egt307-api-gateway-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  selector:
    app: api-gateway-service
  ports:
    - port: 8080
      targetPort: 8080