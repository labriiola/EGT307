apiVersion: v1
kind: Secret
metadata:
  # This is the name other files reference when they pull values from this Secret, database-deployment.yaml and ai-inference-deployment.yaml
  # both use "db-credentials" as the secretKeyRef name
  name: db-credentials
# Opaque is Kubernetes' generic type for arbitrary key-value data, like credentials, the standard type for this kind of use
type: Opaque
data:
  # Values must be base64-encoded, not plain text. This is NOT real encryption, anyone can decode base64 in seconds. It's the required
  # format for a Kubernetes Secret, and it does keep credentials out of the actual application code and Dockerfiles, which is the real point
  DB_USER: YXFpX3VzZXI=  # decodes to: aqi_user
  DB_PASS: YXFpX3Bhc3M=  # decodes to: aqi_pass